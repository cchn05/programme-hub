<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Programme Hub</title>
<style>
:root{--a:#007aff;--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--shadow:0 16px 45px rgba(0,0,0,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}.hide{display:none!important}.wrap{width:min(100%,980px);margin:auto;min-height:100vh}.glass{background:rgba(255,255,255,.92);border:1px solid rgba(60,60,67,.12);box-shadow:var(--shadow);backdrop-filter:blur(20px)}
.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 12% 0,rgba(0,122,255,.15),transparent 32rem)}.loginbox{width:min(100%,520px);border-radius:30px;padding:32px}.logo{width:58px;height:58px;border-radius:18px;background:var(--a);color:#fff;display:grid;place-items:center;font-weight:800}.eyebrow{color:var(--a);font-size:12px;font-weight:800;letter-spacing:.12em;margin:26px 0 9px}.login h1{font-size:42px;letter-spacing:-.05em;line-height:1.05;margin:0 0 10px}.sub{color:var(--muted);line-height:1.6;margin:0 0 24px}.label{display:block;color:var(--muted);font-size:13px;font-weight:700;margin:20px 0 9px}.projects{display:grid;gap:10px}.project{width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:13px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer}.project.on{border-color:var(--a);box-shadow:0 0 0 3px rgba(0,122,255,.1)}.badge{width:43px;height:43px;border-radius:13px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800}.project strong,.project small{display:block}.project small{color:var(--muted);margin-top:3px}.radio{width:18px;height:18px;border:2px solid var(--line);border-radius:50%;margin-left:auto}.project.on .radio{border:5px solid var(--a)}.input{width:100%;border:1px solid var(--line);border-radius:16px;padding:15px 16px;background:#fafafa;outline:none}.input:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(0,122,255,.1)}.primary{width:100%;border:0;border-radius:16px;background:var(--a);color:#fff;padding:15px;font-weight:800;margin-top:16px;cursor:pointer}.primary:disabled{opacity:.35}
.app{padding:0 16px 104px}.top{height:66px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:9;background:rgba(245,245,247,.82);backdrop-filter:blur(20px)}.brand{font-weight:800}.actions{display:flex;gap:9px}.round{height:38px;min-width:38px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:800}.section{display:none}.section.on{display:block}.hero{padding:36px 0 24px}.date{color:var(--a);font-size:13px;font-weight:800}.hero h1{font-size:clamp(38px,8vw,64px);letter-spacing:-.055em;line-height:1.02;margin:9px 0 10px}.hero p{color:var(--muted);font-size:17px;margin:0}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.stack{display:grid;gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:25px;box-shadow:var(--shadow);overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;padding:21px 22px 8px}.head h2{font-size:18px;margin:0}.link{border:0;background:none;color:var(--a);font-weight:700}.course{padding:7px 22px 23px}.ctime{color:var(--a);font-weight:800;font-size:14px;margin:10px 0}.course h3{font-size:clamp(27px,5vw,40px);letter-spacing:-.04em;line-height:1.08;margin:0 0 20px}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#f2f2f7;border-radius:12px;padding:9px 11px;color:var(--muted);font-size:13px}.notices{padding:4px 17px 16px}.notice{display:grid;grid-template-columns:8px 1fr auto;gap:11px;padding:14px 4px;border-bottom:1px solid var(--line)}.notice:last-child{border:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--a);margin-top:6px}.dot.red{background:#ff3b30}.notice strong{font-size:14px}.notice p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.notice time{font-size:11px;color:var(--muted)}.weather{padding:8px 22px 22px}.temp{font-size:68px;font-weight:300;letter-spacing:-.08em}.condition{color:var(--muted);margin:3px 0 15px}.tip{background:rgba(0,122,255,.09);border-radius:14px;padding:13px;font-size:13px;line-height:1.55;margin-top:14px}.photos{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:11px;overflow-x:auto;padding:8px 17px 20px}.photo{aspect-ratio:4/3;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(145deg,var(--c1),var(--c2))}.photo:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.24);right:-20px;top:-20px}.photo:after{content:"";position:absolute;width:170px;height:70px;border-radius:30px;background:rgba(255,255,255,.18);left:20px;top:40px}.caption{position:absolute;left:0;right:0;bottom:0;padding:45px 14px 13px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}.caption strong,.caption small{display:block}.caption small{opacity:.8;margin-top:4px}.pagehead{padding:40px 0 18px}.pagehead small{color:var(--a);font-weight:800}.pagehead h1{font-size:44px;letter-spacing:-.05em;margin:6px 0}.timeline{padding:12px 21px}.trow{display:grid;grid-template-columns:68px 22px 1fr;min-height:86px}.ttime{padding-top:18px;font-weight:800}.axis{position:relative}.axis:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:1px;background:var(--line)}.axis:after{content:"";position:absolute;left:6px;top:23px;width:9px;height:9px;border-radius:50%;background:var(--muted)}.trow.current .axis:after{background:var(--a);box-shadow:0 0 0 6px rgba(0,122,255,.12)}.tcontent{padding:17px 0;border-bottom:1px solid var(--line)}.tcontent span{display:block;color:var(--muted);font-size:13px;margin-top:5px}.noticecards{display:grid;gap:11px}.ncard{padding:20px 21px}.tag{display:inline-flex;padding:6px 9px;border-radius:999px;background:rgba(0,122,255,.1);color:var(--a);font-size:11px;font-weight:800}.tag.red{background:rgba(255,59,48,.1);color:#ff3b30}.ncard h3{margin:12px 0 7px}.ncard p{color:var(--muted);line-height:1.65;margin:0}.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photogrid .photo{aspect-ratio:1}.profile{max-width:650px;padding:23px}.profiletop{display:flex;gap:15px;align-items:center;padding-bottom:19px;border-bottom:1px solid var(--line)}.avatar{width:58px;height:58px;border-radius:18px;background:var(--a);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800}.profiletop h3{margin:0}.profiletop p{margin:5px 0 0;color:var(--muted)}.prow{display:flex;justify-content:space-between;padding:17px 0;border-bottom:1px solid var(--line)}.prow span:last-child{color:var(--muted)}.logout{width:100%;border:0;border-radius:15px;background:rgba(255,59,48,.1);color:#ff3b30;padding:14px;font-weight:800;margin-top:18px}.nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),620px);display:grid;grid-template-columns:repeat(5,1fr);padding:7px;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:23px;box-shadow:0 14px 40px rgba(0,0,0,.15);backdrop-filter:blur(22px);z-index:20}.nav button{border:0;background:none;border-radius:17px;padding:8px 2px;color:var(--muted);font-size:11px;font-weight:700}.nav button.on{background:rgba(0,122,255,.09);color:var(--a)}.nav b{display:block;font-size:18px;margin-bottom:2px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.photogrid{grid-template-columns:repeat(2,1fr)}.notice{grid-template-columns:8px 1fr}.notice time{grid-column:2}.loginbox{padding:26px}.login h1{font-size:37px}}
</style>
</head>
<body>
<div class="wrap">
<section id="login" class="login"><div class="loginbox glass"><div class="logo">PH</div><div class="eyebrow">PROGRAMME HUB</div><h1>欢迎回来</h1><p class="sub">请选择项目并输入姓名，查看今天的课程、天气、通知和照片。</p><span class="label">选择项目</span><div id="projects" class="projects"></div><label class="label" for="name">姓名</label><input id="name" class="input" placeholder="请输入你的姓名"><button id="enter" class="primary" disabled>进入项目</button></div></section>
<section id="app" class="app hide"><header class="top"><div id="brand" class="brand"></div><div class="actions"><button id="lang" class="round">EN</button><button id="avatarTop" class="round">U</button></div></header>
<main>
<section id="home" class="section on"><div class="hero"><div id="date" class="date"></div><h1 id="greeting"></h1><p id="welcome"></p></div><div class="grid"><div class="stack"><article class="card"><div class="head"><h2 data-t="todayCourse">今日课程</h2><button class="link" data-go="schedule">查看全部</button></div><div class="course"><div id="courseTime" class="ctime"></div><h3 id="courseTitle"></h3><div class="pills"><span id="speaker" class="pill"></span><span id="location" class="pill"></span></div></div></article><article class="card"><div class="head"><h2 data-t="latest">最新通知</h2><button class="link" data-go="notices">查看全部</button></div><div id="homeNotices" class="notices"></div></article></div><div class="stack"><article class="card"><div class="head"><h2 data-t="weather">今日天气</h2><span id="city"></span></div><div class="weather"><div id="temp" class="temp"></div><div id="condition" class="condition"></div><div class="pills"><span id="rain" class="pill"></span><span id="humidity" class="pill"></span></div><div id="tip" class="tip"></div></div></article><article class="card"><div class="head"><h2 data-t="photos">今日照片</h2><button class="link" data-go="photos">查看全部</button></div><div id="homePhotos" class="photos"></div></article></div></div></section>
<section id="schedule" class="section"><div class="pagehead"><small>PROGRAMME</small><h1 data-t="schedule">日程</h1></div><div id="timeline" class="card timeline"></div></section>
<section id="notices" class="section"><div class="pagehead"><small>UPDATES</small><h1 data-t="notices">通知</h1></div><div id="noticeCards" class="noticecards"></div></section>
<section id="photos" class="section"><div class="pagehead"><small>MOMENTS</small><h1 data-t="photos">照片</h1></div><div id="photoGrid" class="photogrid"></div></section>
<section id="profile" class="section"><div class="pagehead"><small>ACCOUNT</small><h1 data-t="me">我的</h1></div><div class="card profile"><div class="profiletop"><div id="avatar" class="avatar">U</div><div><h3 id="profileName"></h3><p id="profileProject"></p></div></div><div class="prow"><span data-t="project">项目</span><span id="profileProject2"></span></div><div class="prow"><span data-t="language">语言</span><span id="profileLang"></span></div><button id="logout" class="logout">切换项目 / 退出</button></div></section>
</main>
<nav class="nav"><button class="on" data-tab="home"><b>⌂</b><span data-t="home">首页</span></button><button data-tab="schedule"><b>◷</b><span data-t="schedule">日程</span></button><button data-tab="notices"><b>◉</b><span data-t="notices">通知</span></button><button data-tab="photos"><b>▧</b><span data-t="photos">照片</span></button><button data-tab="profile"><b>♙</b><span data-t="me">我的</span></button></nav></section>
</div>
<script>
const DATA={
uae:{name:'2026 UAE',sub:'Summer Chinese Programme',short:'UAE',accent:'#007aff',welcomeZh:'今天的重要信息，都在这里。',welcomeEn:'Everything important for today, in one place.',course:{time:'09:00–12:00',zh:'中华文化教学多模态资源的生成与使用',en:'Creating and Using Multimodal Resources for Chinese Culture Teaching',speakerZh:'张天池',speakerEn:'Zhang Tianchi',placeZh:'物理楼二楼报告厅',placeEn:'Physics Building, 2F Auditorium'},weather:{cityZh:'上海',cityEn:'Shanghai',temp:'32°',conditionZh:'多云 · 最高 35° / 最低 27°',conditionEn:'Cloudy · H 35° / L 27°',rain:'35%',humidity:'68%',tipZh:'下午可能有阵雨，记得带伞并注意防暑。',tipEn:'Possible afternoon showers. Bring an umbrella and stay hydrated.'},schedule:[['08:40','酒店发车','Depart from hotel'],['09:00','上午课程','Morning class'],['12:00','午餐','Lunch'],['13:45','前往新天地','Transfer to Xintiandi'],['18:30','上海马戏城','Shanghai Circus World']],notices:[['重要','IMPORTANT','明日上午请于 08:30 前在酒店大堂集合。','Meet in the hotel lobby before 8:30 tomorrow morning.',1],['行程调整','Schedule update','今日返程时间调整为 20:00。','Today’s return time has been changed to 20:00.',0]]},
principals:{name:'2026 华校校长',sub:'Overseas Chinese Educators',short:'华校',accent:'#af1f2d',welcomeZh:'课程安排、重要通知与活动照片一目了然。',welcomeEn:'Courses, updates and programme moments at a glance.',course:{time:'09:00–12:00',zh:'华文教育与国家文化软实力',en:'Chinese Education and National Cultural Soft Power',speakerZh:'曹秀玲',speakerEn:'Cao Xiuling',placeZh:'物理楼二楼报告厅',placeEn:'Physics Building, 2F Auditorium'},weather:{cityZh:'上海',cityEn:'Shanghai',temp:'32°',conditionZh:'多云 · 最高 35° / 最低 27°',conditionEn:'Cloudy · H 35° / L 27°',rain:'35%',humidity:'68%',tipZh:'天气炎热，请及时补水。',tipEn:'Hot weather today. Stay hydrated.'},schedule:[['08:10','酒店发车','Depart from hotel'],['09:00','专题讲座','Featured lecture'],['12:00','午餐','Lunch'],['13:30','下午活动','Afternoon activity'],['17:00','返回酒店','Return to hotel']],notices:[['提醒','REMINDER','请携带学员证并按大巴分配表乘车。','Bring your programme badge and follow the bus allocation list.',1],['资料更新','MATERIALS','今日讲座资料已更新。','Today’s lecture materials have been updated.',0]]},
vietnam:{name:'2025 越南大学生',sub:'Vietnam University Programme',short:'VN',accent:'#008f74',welcomeZh:'你的每日课程与活动信息。',welcomeEn:'Your daily classes and activities.',course:{time:'09:00–11:30',zh:'中国文化体验课程',en:'Chinese Culture Experience',speakerZh:'项目教师',speakerEn:'Programme Faculty',placeZh:'教学楼 206',placeEn:'Teaching Building 206'},weather:{cityZh:'上海',cityEn:'Shanghai',temp:'31°',conditionZh:'晴间多云 · 最高 34° / 最低 26°',conditionEn:'Partly cloudy · H 34° / L 26°',rain:'20%',humidity:'65%',tipZh:'有户外活动，建议做好防晒。',tipEn:'Outdoor activities today. Sun protection is recommended.'},schedule:[['08:30','集合出发','Meet and depart'],['09:00','上午课程','Morning class'],['11:30','午餐','Lunch'],['14:00','文化参访','Cultural visit'],['17:30','自由活动','Free time']],notices:[['集合提醒','MEETING','请提前十分钟到达集合地点。','Arrive at the meeting point ten minutes early.',1],['照片更新','PHOTOS','昨日活动照片已经上传。','Yesterday’s activity photos are now available.',0]]}}
};
const T={zh:{todayCourse:'今日课程',latest:'最新通知',weather:'今日天气',photos:'照片',schedule:'日程',notices:'通知',me:'我的',project:'项目',language:'语言',home:'首页'},en:{todayCourse:"Today’s Course",latest:'Latest Notices',weather:"Today’s Weather",photos:'Photos',schedule:'Schedule',notices:'Notices',me:'Me',project:'Project',language:'Language',home:'Home'}};
let state={project:localStorage.ph_project||'uae',name:localStorage.ph_name||'',lang:localStorage.ph_lang||'zh',tab:'home'};const $=id=>document.getElementById(id);const txt=(o,z,e)=>state.lang==='zh'?o[z]:o[e];
function theme(){document.documentElement.style.setProperty('--a',DATA[state.project].accent)}
function renderProjects(){projects.innerHTML=Object.entries(DATA).map(([k,p])=>`<button class="project ${k===state.project?'on':''}" data-p="${k}"><span class="badge" style="--c:${p.accent}">${p.short}</span><span><strong>${p.name}</strong><small>${p.sub}</small></span><i class="radio"></i></button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{state.project=b.dataset.p;theme();renderProjects();validate()})}
function validate(){enter.disabled=!name.value.trim()}
function dateText(){return new Intl.DateTimeFormat(state.lang==='zh'?'zh-CN':'en-US',{month:'long',day:'numeric',weekday:'long'}).format(new Date())}
function greet(){let h=new Date().getHours();return state.lang==='zh'?(h<12?'早上好':h<18?'下午好':'晚上好'):(h<12?'Good morning':h<18?'Good afternoon':'Good evening')}
function photoCards(){return [['#3277d5','#8cc8ff',state.lang==='zh'?'校园时光':'Campus Moments',state.lang==='zh'?'12 张照片':'12 photos'],['#af1f2d','#ffb7c3',state.lang==='zh'?'今日课堂':"Today’s Class",state.lang==='zh'?'18 张照片':'18 photos'],['#008f74','#8de1c9',state.lang==='zh'?'上海印象':'Shanghai Impressions',state.lang==='zh'?'24 张照片':'24 photos']].map(x=>`<div class="photo" style="--c1:${x[0]};--c2:${x[1]}"><div class="caption"><strong>${x[2]}</strong><small>${x[3]}</small></div></div>`).join('')}
function render(){const p=DATA[state.project];theme();brand.textContent=p.name;date.textContent=dateText();greeting.textContent=`${greet()}，${state.name}`;welcome.textContent=state.lang==='zh'?p.welcomeZh:p.welcomeEn;courseTime.textContent=p.course.time;courseTitle.textContent=state.lang==='zh'?p.course.zh:p.course.en;speaker.textContent='👤 '+(state.lang==='zh'?'主讲人：':'Speaker: ')+(state.lang==='zh'?p.course.speakerZh:p.course.speakerEn);location.textContent='⌖ '+(state.lang==='zh'?p.course.placeZh:p.course.placeEn);city.textContent=state.lang==='zh'?p.weather.cityZh:p.weather.cityEn;temp.textContent=p.weather.temp;condition.textContent=state.lang==='zh'?p.weather.conditionZh:p.weather.conditionEn;rain.textContent=(state.lang==='zh'?'降雨概率 ':'Rain ')+p.weather.rain;humidity.textContent=(state.lang==='zh'?'湿度 ':'Humidity ')+p.weather.humidity;tip.textContent=state.lang==='zh'?p.weather.tipZh:p.weather.tipEn;homeNotices.innerHTML=p.notices.map(n=>`<div class="notice"><span class="dot ${n[4]?'red':''}"></span><div><strong>${state.lang==='zh'?n[0]:n[1]}</strong><p>${state.lang==='zh'?n[2]:n[3]}</p></div><time>${state.lang==='zh'?'今天':'Today'}</time></div>`).join('');noticeCards.innerHTML=p.notices.map(n=>`<article class="card ncard"><span class="tag ${n[4]?'red':''}">${state.lang==='zh'?n[0]:n[1]}</span><h3>${state.lang==='zh'?n[0]:n[1]}</h3><p>${state.lang==='zh'?n[2]:n[3]}</p></article>`).join('');homePhotos.innerHTML=photoCards();photoGrid.innerHTML=photoCards();timeline.innerHTML=p.schedule.map((s,i)=>`<div class="trow ${i===1?'current':''}"><div class="ttime">${s[0]}</div><div class="axis"></div><div class="tcontent"><strong>${state.lang==='zh'?s[1]:s[2]}</strong><span>${p.name}</span></div></div>`).join('');avatarTop.textContent=(state.name[0]||'U').toUpperCase();avatar.textContent=(state.name[0]||'U').toUpperCase();profileName.textContent=state.name;profileProject.textContent=p.name;profileProject2.textContent=p.name;profileLang.textContent=state.lang==='zh'?'简体中文':'English';lang.textContent=state.lang==='zh'?'EN':'中';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[state.lang][e.dataset.t])}
function showApp(){login.classList.add('hide');app.classList.remove('hide');render();tab('home')}
function tab(t){state.tab=t;document.querySelectorAll('.section').forEach(s=>s.classList.toggle('on',s.id===t));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));scrollTo(0,0)}
enter.onclick=()=>{state.name=name.value.trim();localStorage.ph_project=state.project;localStorage.ph_name=state.name;localStorage.ph_lang=state.lang;showApp()};name.oninput=validate;name.onkeydown=e=>{if(e.key==='Enter'&&!enter.disabled)enter.click()};lang.onclick=()=>{state.lang=state.lang==='zh'?'en':'zh';localStorage.ph_lang=state.lang;render()};avatarTop.onclick=()=>tab('profile');logout.onclick=()=>{localStorage.removeItem('ph_name');state.name='';app.classList.add('hide');login.classList.remove('hide');name.value='';validate()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>tab(b.dataset.go));renderProjects();theme();name.value=state.name;validate();if(state.name)showApp();
</script>
</body>
</html>
