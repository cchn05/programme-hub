<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Programme Hub</title>
  <link rel="stylesheet" href="./assets/site.css">
</head>
<body>
  <div id="boot" class="boot">正在连接 Programme Hub…</div>

  <main id="loginView" class="login-view hidden">
    <section class="login-card">
      <div class="logo">PH</div>
      <p class="eyebrow">PROGRAMME HUB</p>
      <h1>欢迎回来</h1>
      <p class="muted">选择项目并验证身份，查看今天的课程、通知和照片。</p>

      <label for="projectSelect">项目</label>
      <select id="projectSelect"></select>

      <label for="memberName">姓名</label>
      <input id="memberName" autocomplete="name" placeholder="请输入名单中的姓名">

      <label for="memberPin">个人 PIN</label>
      <input id="memberPin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="请输入 4–6 位 PIN">

      <button id="loginButton" class="primary">进入项目</button>
      <p id="loginMessage" class="message" aria-live="polite"></p>
    </section>
  </main>

  <div id="appView" class="app hidden">
    <header class="topbar">
      <div>
        <small id="projectLabel">PROGRAMME</small>
        <strong id="projectName"></strong>
      </div>
      <div class="top-actions">
        <button id="languageButton" class="round" type="button">EN</button>
        <button id="logoutButton" class="round" type="button" title="退出">↗</button>
      </div>
    </header>

    <section id="homePage" class="page active">
      <div class="hero">
        <p id="dateText" class="accent"></p>
        <h1 id="greetingText"></h1>
        <p id="welcomeText" class="muted"></p>
      </div>

      <div class="dashboard-grid">
        <article id="courseCard" class="card feature-card">
          <div class="card-head"><h2 data-i18n="todayCourse">今日课程</h2><button class="link" data-page-link="schedule">查看全部</button></div>
          <div id="courseEmpty" class="empty hidden">今天暂无已发布课程。</div>
          <div id="courseContent">
            <p id="courseTime" class="accent strong"></p>
            <h3 id="courseTitle"></h3>
            <div class="chips"><span id="courseSpeaker" class="chip"></span><span id="courseLocation" class="chip"></span></div>
          </div>
        </article>

        <article id="weatherCard" class="card">
          <div class="card-head"><h2 data-i18n="weather">今日天气</h2><span id="weatherCity"></span></div>
          <div class="weather-body">
            <div id="weatherTemperature" class="temperature">--°</div>
            <p id="weatherSummary" class="muted"></p>
            <div class="chips"><span id="weatherRain" class="chip"></span><span id="weatherHumidity" class="chip"></span></div>
            <p id="weatherTip" class="weather-tip"></p>
          </div>
        </article>

        <article id="noticeCard" class="card">
          <div class="card-head"><h2 data-i18n="latestNotices">最新通知</h2><button class="link" data-page-link="notices">查看全部</button></div>
          <div id="homeNotices" class="list"></div>
        </article>

        <article id="albumCard" class="card">
          <div class="card-head"><h2 data-i18n="todayPhotos">今日照片</h2><button class="link" data-page-link="photos">查看全部</button></div>
          <div id="homeAlbums" class="album-strip"></div>
        </article>
      </div>
    </section>

    <section id="schedulePage" class="page">
      <div class="page-head"><p class="eyebrow">PROGRAMME</p><h1 data-i18n="schedule">日程</h1></div>
      <div class="date-filter"><label for="scheduleDate">日期</label><input id="scheduleDate" type="date"></div>
      <div id="scheduleList" class="timeline card"></div>
    </section>

    <section id="noticesPage" class="page">
      <div class="page-head"><p class="eyebrow">UPDATES</p><h1 data-i18n="notices">通知</h1></div>
      <div id="noticeList" class="notice-grid"></div>
    </section>

    <section id="photosPage" class="page">
      <div class="page-head"><p class="eyebrow">MOMENTS</p><h1 data-i18n="photos">照片</h1></div>
      <div id="albumList" class="album-grid"></div>
      <section id="photoViewer" class="photo-viewer hidden">
        <div class="viewer-head"><button id="closeViewer" class="link">← 返回相册</button><h2 id="viewerTitle"></h2></div>
        <div id="photoList" class="photo-grid"></div>
      </section>
    </section>

    <section id="profilePage" class="page">
      <div class="page-head"><p class="eyebrow">ACCOUNT</p><h1 data-i18n="profile">我的</h1></div>
      <article class="card profile-card">
        <div class="avatar" id="profileAvatar">U</div>
        <div><h2 id="profileName"></h2><p id="profileMeta" class="muted"></p></div>
      </article>
    </section>

    <nav class="bottom-nav">
      <button data-page="home" class="active"><b>⌂</b><span data-i18n="home">首页</span></button>
      <button data-page="schedule"><b>◷</b><span data-i18n="schedule">日程</span></button>
      <button data-page="notices"><b>◉</b><span data-i18n="notices">通知</span></button>
      <button data-page="photos"><b>▧</b><span data-i18n="photos">照片</span></button>
      <button data-page="profile"><b>♙</b><span data-i18n="profile">我的</span></button>
    </nav>
  </div>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
